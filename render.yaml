services:
  - type: web
    name: tz-trade-hub
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_NAME
        value: TZ Trade Hub
      - key: NODE_ENV
        value: production
      # Set these two directly in the Render dashboard instead of here,
      # so the real secret values never end up in this file / git repo:
      #   CLICKPESA_CLIENT_ID
      #   CLICKPESA_API_KEY
      - key: CLICKPESA_BASE_URL
        value: https://api.clickpesa.com/third-parties
      - key: APP_BASE_URL
        value: https://tz-trade-hub.onrender.com
